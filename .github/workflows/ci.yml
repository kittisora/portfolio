name: CI

on:
    push:
        # master pushes are already validated by the `validate` job in
        # deploy.yml before it ships; running the same checks here too would
        # just duplicate every production run.
        branches: [staging]
    pull_request:
        branches: [master, staging]

# Cancel superseded runs on the same ref.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Typecheck, lint and build
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            # Build first: `next-env.d.ts` is gitignored, and it declares the
            # image module types used by static image imports. tsc before the
            # build fails with TS2307 on a fresh checkout.
            - name: Build
              run: npm run build

            - name: Typecheck
              run: npm run typecheck
